<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card source — 1200×630</title>
<!-- Reuses the page's own stylesheet and classes rather than reimplementing
     the world in parallel values, so the card cannot drift from the site.
     Scaling happens on the root font size; every type step still comes from
     the DESIGN.md ramp. -->
<link rel="stylesheet" href="../styles.css">
<style>
  /* Canvas scale, not a type step: the card is a fixed 1200x630 raster viewed
     small, so the whole rem ramp is scaled from the root rather than any
     individual size being overridden. --d-name is re-pointed, not bypassed:
     the card has a fixed width, so the page's viewport-fluid step has nothing
     to respond to. */
  :root {
    --og-canvas-scale: 22px;
    --d-name: 5.8rem;
    --lede-top: var(--s5);
  }

  html { font-size: var(--og-canvas-scale); }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  .lede {
    width: 1200px;
    height: 630px;
  }

  /* No page-load moment in a still. */
  .lede::before { animation: none; }

  .lede__inner {
    max-width: none;
    padding-inline: var(--s5);
  }

  .lede__field {
    padding-bottom: 0;
    padding-top: var(--s4);
  }

  .titles { border-bottom: none; padding-bottom: 0; margin-bottom: var(--s4); }
  .creds { margin-bottom: 0; }
</style>
</head>
<body>
<header class="lede">
  <div class="lede__inner">
    <h1 class="name"><span>Visanu</span><span>Mongsaithong</span></h1>
    <div class="lede__field">
      <ul class="titles">
        <li class="titles__item">AI/ML Engineer</li>
        <li class="titles__item">Cloud Solution Architect</li>
        <li class="titles__item">Senior Software Engineer</li>
      </ul>
      <ul class="creds">
        <li class="cred-chip">DoD TS/SCI<b>Cleared</b></li>
        <li class="cred-chip">AWS<b>GovCloud</b></li>
        <li class="cred-chip">Regulated<b>HIPAA</b></li>
      </ul>
    </div>
  </div>
</header>
</body>
</html>
